plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.opensabre.sample'
version = '0.0.1-SNAPSHOT'

ext {
    lombokVersion = '1.18.42'
    opensabreVersion = '1.1.1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// 统一的编译器参数配置
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add '-parameters'
    options.encoding = 'UTF-8'
}

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    // Lombok配置
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    testCompileOnly "org.projectlombok:lombok:${lombokVersion}"

    implementation "io.github.opensabre:opensabre-starter-boot:${opensabreVersion}"
    implementation "io.github.opensabre:opensabre-starter-webmvc:${opensabreVersion}"
    implementation "io.github.opensabre:opensabre-starter-rpc:${opensabreVersion}"
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'jakarta.servlet:jakarta.servlet-api'
    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// 添加一些有用的任务配置
tasks.withType(Test).configureEach {
    systemProperty 'file.encoding', 'UTF-8'
}

// 配置jar任务
jar {
    enabled = true
    archiveClassifier = ''
}
