server.port=8080
spring.application.name=sample-cloud
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_ISSUER_URI:http://localhost:8000}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_JWK_SET_URI:http://localhost:8000/oauth2/jwks}

management.endpoints.web.exposure.include=*

logging.level.com.opensabre.sample.provider=debug
